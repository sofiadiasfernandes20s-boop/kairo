<div class="pagina">

      Kair<span class="relogio"></span>
    </h1>

  </div>

  <!-- Lado direito: formulário -->
  <form class="formulario">
    <h2>Entrar</h2>

      Não tem conta? <a href="#">Cadastrar</a>
    </p>
  </form>

</div>
